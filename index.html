    <style>
        :root {
            --navy-900:#0B1F3A; --navy-800:#0F2A4F; --navy-700:#123A6B; --accent:#0560A9;
            --bg:#F3F5F8; --card:#FFFFFF; --text:#111827; --muted:#4B5563; --subtle:#9CA3AF; --line:#E5E7EB; --danger:#B91C1C;
            --radius:20px; --shadow:0 20px 60px rgba(11,31,58,.12);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
        }

        /* ===== Language toggle ===== */
        .language-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 2px;
            background: #fff;
            border-radius: 999px;
            padding: 4px;
            box-shadow: 0 8px 24px rgba(11,31,58,.10);
        }

        .language-toggle button {
            border: 0;
            background: transparent;
            color: var(--subtle);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: 999px;
            cursor: pointer;
            transition: background .2s ease, color .2s ease;
        }

        .language-toggle button.active { background: var(--navy-900); color: #fff; }
        .language-toggle button:not(.active):hover { color: var(--text); }

        /* ===== Card ===== */
        .cv-container {
            width: 100%;
            max-width: 560px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeUp .3s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cv-container { animation: none; }
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(150deg, var(--navy-900) 0%, var(--navy-700) 100%);
            color: #fff;
            padding: 40px 40px 32px;
            text-align: left;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,.35);
            display: block;
        }

        .header h1 {
            text-transform: uppercase;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: .5px;
            line-height: 1.15;
            margin: 16px 0 6px;
        }

        .role {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255,255,255,.85);
            margin: 0;
        }

        .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .pill {
            background: rgba(255,255,255,.10);
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            gap: 8px;
            align-items: center;
            transition: background .2s ease;
        }

        .pill:hover { background: rgba(255,255,255,.18); }

        /* ===== Body ===== */
        .body { padding: 32px 40px 28px; }

        .question {
            display: block;
            font-size: 17px;
            font-weight: 600;
            margin: 0;
        }

        .hint {
            font-size: 14px;
            color: var(--muted);
            margin: 4px 0 16px;
        }

        .field { position: relative; }

        .field i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--subtle);
            font-size: 14px;
        }

        .field input {
            height: 48px;
            width: 100%;
            box-sizing: border-box;
            padding: 0 14px 0 42px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            font-size: 15px;
            color: var(--text);
        }

        .field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(5,96,169,.15);
        }

        .field-error {
            font-size: 13px;
            color: var(--danger);
            margin-top: 8px;
            margin-bottom: 0;
        }

        #accessBtn {
            margin-top: 14px;
            width: 100%;
            height: 48px;
            background: var(--navy-900);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s ease;
        }

        #accessBtn:hover { background: var(--navy-800); }
        #accessBtn:active { transform: translateY(1px); }
        #accessBtn:disabled { opacity: .7; cursor: default; }
        #accessBtn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(5,96,169,.35); }

        .skip-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            color: var(--accent);
            text-decoration: none;
        }

        .skip-link:hover { text-decoration: underline; }

        .privacy {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 12.5px;
            color: var(--subtle);
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        /* ===== Mobile ===== */
        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .cv-container { border-radius: 16px; }
            .header { padding: 28px 22px 24px; }
            .body { padding: 24px 22px; }
            .header h1 { font-size: 22px; }
            .pill { font-size: 12px; padding: 7px 11px; }
            .language-toggle { top: 12px; right: 12px; }
            .language-toggle button { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>

    var LANG_KEY = 'cv_lang';
    var HAS_GENERAL_PT = true;
    var currentLang = 'en';

    function getInitialLang() {
        var params = new URLSearchParams(window.location.search);
        var urlLang = params.get('lang');
        if (urlLang === 'pt' || urlLang === 'en') return urlLang;
        try {
            var stored = localStorage.getItem(LANG_KEY);
            if (stored === 'pt' || stored === 'en') return stored;
        } catch (e) {}
        if (navigator.language && navigator.language.toLowerCase().indexOf('pt') === 0) return 'pt';
        return 'en';
    }

    function setLang(lang) {
        currentLang = lang;
        var t = texts[lang];
        document.documentElement.lang = (lang === 'pt') ? 'pt-BR' : 'en';
        document.title = t.title;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var key = el.getAttribute('data-i18n');
            el.textContent = t[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
            var key = el.getAttribute('data-i18n-placeholder');
            el.placeholder = t[key];
        });
        var skipLink = document.getElementById('skipLink');
        if (skipLink) skipLink.href = t.skipHref;
        document.querySelectorAll('.language-toggle button').forEach(function (btn) {
            var isActive = btn.getAttribute('data-lang') === lang;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
        try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    }

    function preferPortuguese(target) {
        if (/_pt\.html$/.test(target)) return target;
        var cand = target.replace(/\.html$/, '_pt.html');
        if (Object.prototype.hasOwnProperty.call(companyMappings, cand)) return cand;
        if (cand === 'templates/companies/general_pt.html' && HAS_GENERAL_PT) return cand;
        return target;
    }

    function checkCompany() {
        var input = document.getElementById('companyName');
        var errorEl = document.getElementById('fieldError');
        var raw = input.value.trim().toLowerCase();
        if (!raw) {
            errorEl.hidden = false;
            input.focus();
            return;
        }
        var target = 'templates/companies/general.html';
        for (var page in companyMappings) {
            if (!Object.prototype.hasOwnProperty.call(companyMappings, page)) continue;
            var keywords = companyMappings[page];
            if (keywords.some(function (k) { return k === raw; })) {
                target = page;
                break;
            }
        }
        if (currentLang === 'pt') {
            target = preferPortuguese(target);
        }
        var btn = document.getElementById('accessBtn');
        btn.disabled = true;
        btn.querySelector('span').textContent = texts[currentLang].ctaLoading;
        window.location.href = target;
    }

    document.addEventListener('DOMContentLoaded', function () {
        var input = document.getElementById('companyName');
        var errorEl = document.getElementById('fieldError');
        var btn = document.getElementById('accessBtn');

        input.addEventListener('input', function () {
            this.value = this.value.toLowerCase().replace(/[^a-z0-9 ]/g, '');
            errorEl.hidden = true;
        });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') checkCompany();
        });
        btn.addEventListener('click', checkCompany);
        document.querySelectorAll('.language-toggle button').forEach(function (b) {
            b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
        });

        setLang(getInitialLang());
    });
    </script>
</body>
</html>
