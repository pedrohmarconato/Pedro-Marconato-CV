<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Pedro Marconato - Insider</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            /* Insider Official Colors — medidas no CSS do insiderstore.com.br
               (--color-button: 0,0,0 / --color-foreground: 61,61,61 / --color-background: 255,255,255).
               A marca nao possui cor de destaque: hierarquia por peso e tracking. */
            --insider-primary: #000000;
            --insider-secondary: #3D3D3D;
            --insider-accent: #EBEBEB;

            /* Escala monocromatica da pagina (dark editorial) */
            --insider-ink: #0A0A0A;
            --insider-surface: #111111;
            --insider-surface-2: #161616;
            --insider-surface-3: #1C1C1C;
            --insider-line: #2A2A2A;
            --insider-line-strong: #3D3D3D;
            --insider-fg: #FFFFFF;
            --insider-fg-muted: #B0B0B0;
            --insider-fg-dim: #6E6E6E;

            /* Cores aplicadas — na pagina escura o "primario" visual e o branco
               sobre o preto da marca. As funcoes compartilhadas do cv-texts.js
               referenciam --primary-color; mante-la legivel no dark e obrigatorio. */
            --primary-color: var(--insider-fg);
            --secondary-color: var(--insider-accent);
            --accent-color: var(--insider-line-strong);
            --text-color: var(--insider-fg-muted);
            --border-color: var(--insider-line);
            --background-gradient: linear-gradient(135deg, var(--insider-primary) 0%, var(--insider-secondary) 100%);

            --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background: var(--insider-ink);
            color: var(--insider-fg-muted);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::selection { background: var(--insider-fg); color: var(--insider-primary); }

        /* ============================================================
           SCROLL PROGRESS — filete de leitura no topo
           ============================================================ */
        .scroll-progress {
            position: fixed; top: 0; left: 0; right: 0; height: 2px;
            background: var(--insider-line); z-index: 300; pointer-events: none;
        }
        .scroll-progress span {
            display: block; height: 100%; width: 0;
            background: var(--insider-fg);
        }

        /* ============================================================
           CURSOR — dot + ring com blend difference (so desktop fine pointer)
           ============================================================ */
        .cursor-dot, .cursor-ring {
            position: fixed; top: 0; left: 0; z-index: 400;
            pointer-events: none; opacity: 0;
            mix-blend-mode: difference;
            will-change: transform;
        }
        .cursor-dot {
            width: 6px; height: 6px; background: #FFFFFF; border-radius: 50%;
            margin: -3px 0 0 -3px;
        }
        .cursor-ring {
            width: 34px; height: 34px; border: 1px solid #FFFFFF; border-radius: 50%;
            margin: -17px 0 0 -17px;
            transition: width .3s var(--ease-out), height .3s var(--ease-out),
                        margin .3s var(--ease-out), opacity .3s ease;
        }
        body.cursor-active .cursor-dot, body.cursor-active .cursor-ring { opacity: 1; }
        body.cursor-hover .cursor-ring {
            width: 62px; height: 62px; margin: -31px 0 0 -31px;
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .cv-container {
            max-width: 1000px;
            margin: 0 auto 80px;
            background: var(--insider-surface);
            border-left: 1px solid var(--insider-line);
            border-right: 1px solid var(--insider-line);
            border-bottom: 1px solid var(--insider-line);
            position: relative;
        }

        /* ============================================================
           HEADER — trama de fios + reveal tipografico
           ============================================================ */
        .header {
            position: relative;
            background: var(--insider-primary);
            padding: 96px 60px 68px;
            overflow: hidden;
            border-bottom: 1px solid var(--insider-line);
        }

        #fabric-canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            opacity: .85;
        }

        .header-inner { position: relative; z-index: 2; }

        .brand-logo {
            width: 132px; height: auto; display: block;
            /* wordmark monocromatico preto -> branco */
            filter: brightness(0) invert(1);
            opacity: 0;
            animation: logoEntrance 1s var(--ease-out) .1s forwards;
        }
        @keyframes logoEntrance {
            from { opacity: 0; transform: translateY(14px); clip-path: inset(0 100% 0 0); }
            to   { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0); }
        }

        .company-tagline {
            margin-top: 26px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4.4px;
            text-transform: uppercase;
            color: var(--insider-fg-dim);
            opacity: 0;
            animation: fadeUp .9s var(--ease-out) .45s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #cv-name {
            margin-top: 20px;
            font-size: clamp(26px, 4.1vw, 44px);
            font-weight: 800;
            line-height: 1.14;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--insider-fg);
        }
        /* o nome quebra em linhas montadas pelo JS — nunca vaza o container */
        #cv-name .line { display: block; }
        /* reveal letra a letra (montado por JS) */
        #cv-name .char {
            display: inline-block;
            transform: translateY(105%);
            animation: charRise .85s var(--ease-out) forwards;
        }
        #cv-name .char-wrap { display: inline-block; overflow: hidden; vertical-align: bottom; }
        @keyframes charRise { to { transform: translateY(0); } }

        .name-rule {
            width: 0; height: 1px; background: var(--insider-fg);
            margin: 26px 0 22px;
            animation: ruleGrow 1.1s var(--ease-out) .9s forwards;
        }
        @keyframes ruleGrow { to { width: 120px; } }

        #cv-role {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 3.6px;
            text-transform: uppercase;
            color: var(--insider-fg-muted);
            opacity: 0;
            animation: fadeUp .9s var(--ease-out) 1.05s forwards;
        }

        .contact-info {
            margin-top: 44px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            opacity: 0;
            animation: fadeUp .9s var(--ease-out) 1.2s forwards;
        }
        .contact-line { display: flex; flex-wrap: wrap; gap: 22px 34px; }

        .contact-item {
            display: inline-flex; align-items: flex-start; gap: 10px;
            font-size: 12.5px; letter-spacing: .6px;
            color: var(--insider-fg-muted);
            text-decoration: none;
            background: none; border: 0; padding: 0;
            font-family: var(--font-sans); cursor: pointer;
            text-align: left;
        }
        .contact-item i { font-size: 12px; color: var(--insider-fg-dim); transition: color .3s ease; margin-top: 4px; }
        .contact-item .label { position: relative; display: inline-block; }
        .contact-item .label::after {
            content: ''; position: absolute; left: 0; bottom: -3px;
            width: 0; height: 1px; background: var(--insider-fg);
            transition: width .4s var(--ease-out);
        }
        .contact-item:hover { color: var(--insider-fg); }
        .contact-item:hover i { color: var(--insider-fg); }
        .contact-item:hover .label::after { width: 100%; }
        .contact-item .cta-hint {
            display: block;
            font-size: 9.5px; letter-spacing: 1.6px; text-transform: uppercase;
            color: var(--insider-fg-dim); margin-top: 3px;
        }

        /* ============================================================
           TICKER — repertorio do CV em loop horizontal
           ============================================================ */
        .ticker {
            border-bottom: 1px solid var(--insider-line);
            background: var(--insider-surface-2);
            overflow: hidden;
            padding: 14px 0;
            white-space: nowrap;
        }
        .ticker-track {
            display: inline-block;
            animation: tickerScroll 42s linear infinite;
        }
        .ticker:hover .ticker-track { animation-play-state: paused; }
        .ticker-item {
            display: inline-block;
            font-size: 11px; font-weight: 700; letter-spacing: 4px;
            text-transform: uppercase; color: var(--insider-fg-dim);
            padding: 0 22px;
        }
        .ticker-item::after { content: '·'; margin-left: 22px; color: var(--insider-line-strong); }
        @keyframes tickerScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* ============================================================
           SECOES
           ============================================================ */
        .section {
            padding: 72px 60px;
            border-bottom: 1px solid var(--insider-line);
            opacity: 0;
            transform: translateY(28px);
            transition: opacity .9s var(--ease-out), transform .9s var(--ease-out);
        }
        .section:last-child { border-bottom: 0; }
        .section.in { opacity: 1; transform: translateY(0); }

        .section-head {
            display: flex; align-items: baseline; gap: 18px;
            margin-bottom: 38px;
        }
        .section-index {
            font-family: var(--font-mono);
            font-size: 11px; color: var(--insider-fg-dim); letter-spacing: 1px;
        }
        .section-title {
            font-size: 13px; font-weight: 700;
            letter-spacing: 4.8px; text-transform: uppercase;
            color: var(--insider-fg);
            white-space: nowrap;
        }
        .section-rule {
            flex: 1; height: 1px; background: var(--insider-line);
            position: relative; overflow: hidden;
        }
        .section-rule::after {
            content: ''; position: absolute; inset: 0;
            background: var(--insider-fg);
            transform: scaleX(0); transform-origin: left center;
            transition: transform 1.1s var(--ease-out) .15s;
        }
        .section.in .section-rule::after { transform: scaleX(1); }

        /* PERFIL */
        #cv-profile {
            font-size: 16px;
            font-weight: 300;
            line-height: 1.85;
            color: var(--insider-fg-muted);
            max-width: 78ch;
        }

        /* ============================================================
           SKILLS — niveis como fios de trama
           ============================================================ */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 44px;
        }
        .skill-column-title {
            font-size: 10px; font-weight: 700; letter-spacing: 3px;
            text-transform: uppercase; color: var(--insider-fg-dim);
            padding-bottom: 12px; margin-bottom: 22px;
            border-bottom: 1px solid var(--insider-line);
        }
        .tool-item {
            margin-bottom: 20px;
            opacity: 0; transform: translateY(14px);
            transition: opacity .7s var(--ease-out), transform .7s var(--ease-out);
            transition-delay: calc(var(--i, 0) * 55ms);
        }
        .section.in .tool-item { opacity: 1; transform: translateY(0); }
        .tool-name {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 12px; margin-bottom: 9px;
        }
        .tool-name > span:first-child {
            font-size: 13px; font-weight: 500; color: var(--insider-fg);
            letter-spacing: .3px;
        }
        .tool-percentage {
            font-family: var(--font-mono);
            font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--insider-fg-dim); white-space: nowrap;
        }
        .dots-container { display: flex; gap: 4px; }
        /* o "dot" da API compartilhada vira fio vertical — trama, nao bolinha */
        .dot {
            width: 3px; height: 16px;
            background: var(--insider-line);
            transition: background .4s var(--ease-out), transform .4s var(--ease-out);
        }
        .dot.filled { background: var(--insider-fg-dim); }
        .tool-item:hover .dot.filled { background: var(--insider-fg); transform: scaleY(1.25); }

        /* ============================================================
           EXPERIENCIA — cards com spotlight
           ============================================================ */
        .experience-item {
            position: relative;
            padding: 30px 32px 30px 34px;
            margin-bottom: 22px;
            background: var(--insider-surface-2);
            border: 1px solid var(--insider-line);
            opacity: 0; transform: translateY(30px);
            transition: opacity .8s var(--ease-out), transform .8s var(--ease-out),
                        border-color .4s ease, background .4s ease;
            /* sem overflow:hidden — cortaria o tooltip, que abre acima do card.
               O spotlight (::after) ja se contem sozinho por inset: 0. */
        }
        .experience-item.animate-in { opacity: 1; transform: translateY(0); }
        .experience-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 1px; background: var(--insider-line-strong);
            transform: scaleY(0); transform-origin: top center;
            transition: transform .9s var(--ease-out) .2s;
        }
        .experience-item.animate-in::before { transform: scaleY(1); }
        .experience-item::after {
            /* spotlight seguindo o mouse */
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(320px circle at var(--mx, -200px) var(--my, -200px),
                        rgba(255,255,255,.055), transparent 62%);
            opacity: 0; transition: opacity .4s ease;
        }
        .experience-item:hover { border-color: var(--insider-line-strong); background: var(--insider-surface-3); }
        .experience-item:hover::after { opacity: 1; }

        .job-title {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            font-size: 15px; font-weight: 700; letter-spacing: 1.4px;
            text-transform: uppercase; color: var(--insider-fg);
            margin-bottom: 10px;
        }
        .job-number {
            font-family: var(--font-mono);
            font-size: 11px; font-weight: 400; letter-spacing: 0;
            width: 26px; height: 26px; flex: none;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--insider-line-strong);
            color: var(--insider-fg-dim);
        }
        .company {
            font-size: 12px; font-weight: 600; letter-spacing: 2.6px;
            text-transform: uppercase; color: var(--insider-fg-muted);
            margin-bottom: 4px;
        }
        .period {
            font-family: var(--font-mono);
            font-size: 11px; letter-spacing: .8px; color: var(--insider-fg-dim);
            margin-bottom: 18px;
        }
        .job-description {
            font-size: 14px; font-weight: 300; line-height: 1.8;
            color: var(--insider-fg-muted); margin-bottom: 24px;
        }

        /* gap real + borda por item: grade impar nao deixa celula fantasma
           (a 4a experiencia tem 3 conquistas em 2 colunas) */
        .achievements-container {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
        }
        .achievement-item {
            display: flex; gap: 14px; padding: 18px;
            background: var(--insider-surface-2);
            border: 1px solid var(--insider-line);
            transition: background .35s ease, border-color .35s ease;
        }
        .achievement-item:hover { border-color: var(--insider-line-strong); }
        .achievement-item:hover { background: var(--insider-surface-3); }
        .achievement-icon {
            width: 30px; height: 30px; flex: none;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--insider-line-strong);
            color: var(--insider-fg-muted); font-size: 12px;
            transition: color .35s ease, border-color .35s ease;
        }
        .achievement-item:hover .achievement-icon { color: var(--insider-fg); border-color: var(--insider-fg); }
        .achievement-title {
            font-size: 11px; font-weight: 700; letter-spacing: 1.8px;
            text-transform: uppercase; color: var(--insider-fg); margin-bottom: 6px;
        }
        .achievement-description {
            font-size: 12.5px; font-weight: 300; line-height: 1.7;
            color: var(--insider-fg-dim);
        }
        .metric {
            color: var(--insider-fg); font-weight: 600;
            font-family: var(--font-mono); font-size: 12px;
            white-space: nowrap;
        }

        /* TOOLTIP */
        .tooltip { position: relative; display: inline-flex; cursor: pointer; }
        .tooltip-icon { font-size: 12px; color: var(--insider-fg-dim); transition: color .3s ease; }
        .tooltip:hover .tooltip-icon, .tooltip.tooltip-active .tooltip-icon { color: var(--insider-fg); }
        .tooltip-text {
            position: absolute; bottom: calc(100% + 12px); left: 50%;
            transform: translateX(-50%) translateY(6px);
            width: 330px; max-width: 78vw;
            max-height: 62vh; overflow-y: auto;
            background: var(--insider-primary);
            border: 1px solid var(--insider-line-strong);
            padding: 18px; z-index: 50;
            opacity: 0; visibility: hidden;
            transition: opacity .3s ease, transform .3s var(--ease-out), visibility .3s;
            text-align: left; text-transform: none; letter-spacing: 0;
        }
        .tooltip:hover .tooltip-text, .tooltip.tooltip-active .tooltip-text {
            opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        }
        /* sem espaco acima: o tooltip abre para baixo (classe posta pelo JS) */
        .tooltip-text.below { top: calc(100% + 12px); bottom: auto; }
        .tooltip-header {
            font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            color: var(--insider-fg); padding-bottom: 10px; margin-bottom: 12px;
            border-bottom: 1px solid var(--insider-line);
        }
        .tooltip-section { margin-bottom: 12px; }
        .tooltip-section:last-child { margin-bottom: 0; }
        .tooltip-section-title {
            font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase;
            color: var(--insider-fg-muted); margin-bottom: 6px;
        }
        .tooltip-list { list-style: none; }
        .tooltip-list li {
            font-size: 11.5px; font-weight: 300; line-height: 1.6;
            color: var(--insider-fg-dim); padding-left: 12px; position: relative;
        }
        .tooltip-list li::before {
            content: ''; position: absolute; left: 0; top: 9px;
            width: 5px; height: 1px; background: var(--insider-line-strong);
        }

        /* ============================================================
           EDUCACAO E PROJETOS — cards com tilt 3D
           ============================================================ */
        .education-grid, .projects-grid {
            display: grid; gap: 20px;
            perspective: 1200px;
        }
        .education-grid { grid-template-columns: repeat(2, 1fr); }
        .projects-grid { grid-template-columns: repeat(3, 1fr); }

        .education-item, .project-item {
            position: relative;
            padding: 28px;
            background: var(--insider-surface-2);
            border: 1px solid var(--insider-line);
            opacity: 0; transform: translateY(26px);
            transition: opacity .8s var(--ease-out), transform .5s var(--ease-out),
                        border-color .4s ease, background .4s ease;
            transform-style: preserve-3d;
            overflow: hidden;
        }
        .education-item.animate-in, .project-item.animate-in { opacity: 1; transform: translateY(0); }
        .education-item:hover, .project-item:hover {
            border-color: var(--insider-line-strong);
            background: var(--insider-surface-3);
        }
        .education-item::after, .project-item::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(260px circle at var(--mx, -200px) var(--my, -200px),
                        rgba(255,255,255,.06), transparent 60%);
            opacity: 0; transition: opacity .4s ease;
        }
        .education-item:hover::after, .project-item:hover::after { opacity: 1; }

        .degree {
            font-size: 14px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: var(--insider-fg); margin-bottom: 8px;
        }
        .university {
            font-size: 12.5px; font-weight: 400; color: var(--insider-fg-muted); margin-bottom: 6px;
        }
        .thesis {
            font-family: var(--font-mono);
            font-size: 11px; color: var(--insider-fg-dim); letter-spacing: .4px;
        }

        .project-title {
            font-size: 13px; font-weight: 700; letter-spacing: 2.4px;
            text-transform: uppercase; color: var(--insider-fg); margin-bottom: 12px;
        }
        .project-description {
            font-size: 13px; font-weight: 300; line-height: 1.75;
            color: var(--insider-fg-dim); margin-bottom: 18px;
        }
        .project-description a { color: var(--insider-fg); text-decoration: none; border-bottom: 1px solid var(--insider-line-strong); }
        .project-description a:hover { border-bottom-color: var(--insider-fg); }

        .tech-tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 10px; letter-spacing: 1px;
            color: var(--insider-fg-muted);
            border: 1px solid var(--insider-line-strong);
            padding: 4px 10px; margin: 0 6px 6px 0;
            transition: color .3s ease, border-color .3s ease;
        }
        .project-item:hover .tech-tag { color: var(--insider-fg); border-color: var(--insider-fg-dim); }

        .cta-button {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 16px;
            font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
            color: var(--insider-primary); background: var(--insider-fg);
            padding: 10px 20px; border-radius: 6px; /* unico raio da marca */
            text-decoration: none;
            transition: opacity .3s ease;
        }
        .cta-button:hover { opacity: .82; }

        /* ============================================================
           CONTROLES FIXOS (fora do .cv-container)
           ============================================================ */
        .language-toggle {
            position: fixed; top: 30px; right: 30px; z-index: 200;
            display: flex; align-items: center;
            background: rgba(10, 10, 10, .92);
            border: 1px solid var(--insider-line-strong);
            backdrop-filter: blur(10px);
        }
        .language-option {
            display: flex; align-items: center; gap: 7px;
            padding: 10px 16px;
            font-size: 11px; font-weight: 700; letter-spacing: 1.6px;
            color: var(--insider-fg-dim); text-decoration: none;
            transition: color .3s ease, background .3s ease;
        }
        .language-option:hover { color: var(--insider-fg); }
        .language-option.active { background: var(--insider-fg); color: var(--insider-primary); }
        .language-option i { font-size: 10px; }
        .language-divider { width: 1px; height: 18px; background: var(--insider-line-strong); }

        .print-button {
            position: fixed; bottom: 30px; right: 30px; z-index: 200;
            width: 60px; height: 60px; border-radius: 50%;

        .modal-close {
            position: absolute; top: 16px; right: 18px;

            display: block; margin-bottom: 7px;
            font-size: 10px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase;
            color: var(--insider-fg-dim);

        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 14px;
            background: var(--insider-primary);
            border: 1px solid var(--insider-line);
            color: var(--insider-fg);
            font-family: var(--font-sans); font-size: 13px;
            transition: border-color .3s ease;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--insider-fg); }
        .form-group textarea { min-height: 104px; resize: vertical; }
        .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .btn-primary, .btn-whatsapp {
            flex: 1;

            padding: 12px 18px; border-radius: 6px;

        .btn-primary { background: var(--insider-fg); color: var(--insider-primary); }

        .btn-whatsapp:hover { border-color: var(--insider-fg); }

        /* ============================================================
           RESPONSIVO

        @media (max-width: 900px) {
            .skills-grid { grid-template-columns: 1fr 1fr; }
            .projects-grid { grid-template-columns: 1fr 1fr; }

        @media (max-width: 768px) {

            .section-title { white-space: normal; }
            /* tooltip ancorado ao CARD (nao ao icone): em tela estreita, centralizar
               no icone jogava a caixa 83px para fora da viewport */

        /* ---------------- Render local (markup proprio da marca) ---------------- */
        function skillLabel(level, lang) {

        function renderSkillColumn(containerId, category, lang) {

        /* ---------------- Metricas: count-up do numero que ja esta escrito ---------------- */
        function wrapMetrics(root) {
            if (!root) return;
            var pattern = /([+-]?\d+(?:[.,]\d+)?)(%|x\b)/g;
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            var targets = [];
            while (walker.nextNode()) {
                pattern.lastIndex = 0;
                if (pattern.test(walker.currentNode.nodeValue)) targets.push(walker.currentNode);
            }
            targets.forEach(function (node) {
                var frag = document.createDocumentFragment();
                var text = node.nodeValue;
                var last = 0, match;
                pattern.lastIndex = 0;
                while ((match = pattern.exec(text)) !== null) {
                    if (match.index > last) frag.appendChild(document.createTextNode(text.slice(last, match.index)));
                    var span = document.createElement('span');
                    span.className = 'metric';
                    span.setAttribute('data-value', match[1]);
                    span.setAttribute('data-suffix', match[2]);
                    span.textContent = match[0];
                    frag.appendChild(span);
                    last = match.index + match[0].length;
                }
                if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
                node.parentNode.replaceChild(frag, node);
            });
        }

        function countUp(el) {
            var raw = el.getAttribute('data-value');
            var suffix = el.getAttribute('data-suffix');
            var sign = raw.charAt(0) === '+' ? '+' : (raw.charAt(0) === '-' ? '-' : '');
            var usesComma = raw.indexOf(',') > -1;
            var numeric = parseFloat(raw.replace(',', '.').replace(/[+-]/, ''));
            if (isNaN(numeric)) return;
            var decimals = (raw.split(/[.,]/)[1] || '').length;
            var duration = 1100;
            var start = null;
            function step(ts) {
                if (!start) start = ts;
                var p = Math.min(1, (ts - start) / duration);
                var eased = 1 - Math.pow(1 - p, 3);
                var current = (numeric * eased).toFixed(decimals);
                if (usesComma) current = current.replace('.', ',');
                el.textContent = sign + current + suffix;
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        /* ---------------- Reveal do nome, letra a letra ---------------- */
        function splitName() {
            var el = document.getElementById('cv-name');
            if (!el) return;
            var words = el.textContent.trim().split(/\s+/);
            // duas linhas balanceadas: nome grande nunca estoura a largura do container
            var cut = Math.ceil(words.length / 2);
            var lines = words.length > 2 ? [words.slice(0, cut), words.slice(cut)] : [words];
            var i = 0;
            el.innerHTML = lines.map(function (line) {
                var content = line.map(function (word) {
                    var chars = word.split('').map(function (ch) {
                        var d = (0.55 + i * 0.028).toFixed(3);
                        i++;
                        return '<span class="char-wrap"><span class="char" style="animation-delay:' + d + 's">' + ch + '</span></span>';
                    }).join('');
                    i++;
                    return '<span class="word">' + chars + '</span>';
                }).join(' ');
                return '<span class="line">' + content + '</span>';
            }).join('');
        }

        /* ---------------- Trama de fios no header (canvas) ---------------- */
        function initFabric() {
            var canvas = document.getElementById('fabric-canvas');
            if (!canvas || !canvas.getContext) return;
            var ctx = canvas.getContext('2d');
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var STEP = 26, RADIUS = 130, PULL = 16;
            var cols = 0, rows = 0, pts = [];
            var mouse = { x: -9999, y: -9999 };
            var t = 0, running = false, rafId = null;

            function build() {
                var w = canvas.offsetWidth, h = canvas.offsetHeight;
                if (!w || !h) return;
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                cols = Math.ceil(w / STEP) + 1;
                rows = Math.ceil(h / STEP) + 1;
                pts = [];
                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        pts.push({ ox: c * STEP, oy: r * STEP, x: c * STEP, y: r * STEP });
                    }
                }
            }

            function draw() {
                var w = canvas.offsetWidth, h = canvas.offsetHeight;
                if (!pts.length) return;
                ctx.clearRect(0, 0, w, h);
                var i, p, dx, dy, dist, force, r, c;

                for (i = 0; i < pts.length; i++) {
                    p = pts[i];
                    var wave = REDUCED_MOTION ? 0
                        : Math.sin((p.ox * 0.014) + t) * 1.6 + Math.cos((p.oy * 0.017) + t * 0.8) * 1.6;
                    var tx = p.ox + wave, ty = p.oy + wave * 0.6;
                    dx = p.ox - mouse.x; dy = p.oy - mouse.y;
                    dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < RADIUS && dist > 0.01) {
                        force = 1 - dist / RADIUS;
                        tx += (dx / dist) * force * PULL;
                        ty += (dy / dist) * force * PULL;
                    }
                    p.x += (tx - p.x) * 0.16;
                    p.y += (ty - p.y) * 0.16;
                }

                ctx.lineWidth = 1;
                // trama (horizontal)
                ctx.strokeStyle = 'rgba(255,255,255,0.055)';
                for (r = 0; r < rows; r++) {
                    ctx.beginPath();
                    for (c = 0; c < cols; c++) {
                        p = pts[r * cols + c];
                        if (c === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                    }
                    ctx.stroke();
                }
                // urdidura (vertical)
                ctx.strokeStyle = 'rgba(255,255,255,0.035)';
                for (c = 0; c < cols; c++) {
                    ctx.beginPath();
                    for (r = 0; r < rows; r++) {
                        p = pts[r * cols + c];
                        if (r === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                    }
                    ctx.stroke();
                }
                // nos iluminados perto do ponteiro
                for (i = 0; i < pts.length; i++) {
                    p = pts[i];
                    dx = p.x - mouse.x; dy = p.y - mouse.y;
                    dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < RADIUS) {
                        ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * (1 - dist / RADIUS)).toFixed(3) + ')';
                        ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
                    }
                }
            }

            function loop() {
                if (!running) return;
                t += 0.012;
                draw();
                rafId = requestAnimationFrame(loop);
            }
            function start() { if (!running) { running = true; loop(); } }
            function stop() { running = false; if (rafId) cancelAnimationFrame(rafId); }

            build();
            draw();
            if (REDUCED_MOTION) return;

            window.addEventListener('resize', function () { build(); draw(); });

            var host = canvas.parentElement;
            host.addEventListener('mousemove', function (e) {
                var rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            });
            host.addEventListener('mouseleave', function () { mouse.x = -9999; mouse.y = -9999; });

            if ('IntersectionObserver' in window) {
                new IntersectionObserver(function (entries) {
                    if (entries[0].isIntersecting) { start(); } else { stop(); }
                }, { threshold: 0 }).observe(canvas);
            } else {
                start();
            }
        }

        /* ---------------- Cursor custom ---------------- */
        function initCursor() {
            if (REDUCED_MOTION || !FINE_POINTER) return;
            var dot = document.getElementById('cursor-dot');
            var ring = document.getElementById('cursor-ring');
            if (!dot || !ring) return;
            var mx = 0, my = 0, rx = 0, ry = 0;
            document.body.classList.add('cursor-active');
            window.addEventListener('mousemove', function (e) {
                mx = e.clientX; my = e.clientY;
                dot.style.transform = 'translate(' + mx + 'px,' + my + 'px)';
            });
            (function follow() {
                rx += (mx - rx) * 0.16;
                ry += (my - ry) * 0.16;
                ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px)';
                requestAnimationFrame(follow);
            })();
            document.addEventListener('mouseover', function (e) {
                var interactive = e.target.closest
                    ? e.target.closest('a, button, .tooltip, .experience-item, .project-item, .education-item')
                    : null;
                document.body.classList.toggle('cursor-hover', !!interactive);
            });
        }

        /* ---------------- Tilt 3D + spotlight ---------------- */
        function initTilt() {
            document.querySelectorAll('.project-item, .education-item').forEach(function (card) {
                var frame = null;
                card.addEventListener('mousemove', function (e) {
                    var rect = card.getBoundingClientRect();
                    var px = e.clientX - rect.left, py = e.clientY - rect.top;
                    card.style.setProperty('--mx', px + 'px');
                    card.style.setProperty('--my', py + 'px');
                    if (REDUCED_MOTION || !FINE_POINTER || frame) return;
                    frame = requestAnimationFrame(function () {
                        var rx = ((py / rect.height) - 0.5) * -6;
                        var ry = ((px / rect.width) - 0.5) * 6;
                        card.style.transform = 'perspective(1200px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
                        frame = null;
                    });
                });
                card.addEventListener('mouseleave', function () {
                    card.style.transform = '';
                    card.style.setProperty('--mx', '-200px');
                    card.style.setProperty('--my', '-200px');
                });
            });
            document.querySelectorAll('.experience-item').forEach(function (item) {
                item.addEventListener('mousemove', function (e) {
                    var rect = item.getBoundingClientRect();
                    item.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
                    item.style.setProperty('--my', (e.clientY - rect.top) + 'px');
                });
            });
        }

        /* ---------------- Botoes magneticos ---------------- */
        function initMagnetic() {
            if (REDUCED_MOTION || !FINE_POINTER) return;
            var targets = document.querySelectorAll('.print-button, .home-button');
            window.addEventListener('mousemove', function (e) {
                targets.forEach(function (el) {
                    var rect = el.getBoundingClientRect();
                    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                    var dx = e.clientX - cx, dy = e.clientY - cy;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    el.style.transform = dist < 110
                        ? 'translate(' + (dx * 0.28).toFixed(1) + 'px,' + (dy * 0.28).toFixed(1) + 'px)'
                        : '';
                });
            });
        }

        /* ---------------- Progresso de leitura ---------------- */
        function initScrollProgress() {
            var bar = document.getElementById('scroll-bar');
            if (!bar) return;
            var ticking = false;
            function update() {
                var max = document.documentElement.scrollHeight - window.innerHeight;
                var p = max > 0 ? window.scrollY / max : 0;
                bar.style.width = (p * 100).toFixed(2) + '%';
                ticking = false;
            }
            window.addEventListener('scroll', function () {
                if (!ticking) { ticking = true; requestAnimationFrame(update); }
            });
            update();
        }

        /* ---------------- Reveal on scroll ---------------- */
        function initReveal() {
            var items = document.querySelectorAll('.experience-item, .project-item, .education-item');
            if (!('IntersectionObserver' in window)) {
                document.querySelectorAll('.section').forEach(function (s) { s.classList.add('in'); });
                items.forEach(function (i) { i.classList.add('animate-in'); });
                document.querySelectorAll('.metric').forEach(function (m) { m.classList.add('counted'); });
                return;
            }

            var sectionObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in');
                        sectionObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
            document.querySelectorAll('.section').forEach(function (s) { sectionObserver.observe(s); });

            var itemObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry, i) {
                    if (entry.isIntersecting) {
                        var el = entry.target;
                        setTimeout(function () { el.classList.add('animate-in'); }, i * 90);
                        itemObserver.unobserve(el);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
            items.forEach(function (el) { itemObserver.observe(el); });

            if (!REDUCED_MOTION) {
                var metricObserver = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            countUp(entry.target);
                            metricObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.8 });
                document.querySelectorAll('.metric').forEach(function (el) { metricObserver.observe(el); });
            }
        }

        /* ---------------- Tooltip por clique ---------------- */
        function initTooltips() {
            document.querySelectorAll('.tooltip').forEach(function (tip) {
                tip.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var wasActive = tip.classList.contains('tooltip-active');
                    document.querySelectorAll('.tooltip').forEach(function (t) { t.classList.remove('tooltip-active'); });
                    if (wasActive) return;
                    tip.classList.add('tooltip-active');

                    // posiciona no lado com mais espaco e limita a altura ao
                    // espaco real — o tooltip mais longo tem ~450px e nao cabe
                    // acima quando o cargo esta no topo da tela
                    var box = tip.querySelector('.tooltip-text');
                    if (!box) return;
                    box.classList.remove('below');
                    box.style.maxHeight = '';
                    var MARGEM = 16;
                    var anchor = tip.getBoundingClientRect();
                    var espacoAcima = anchor.top - MARGEM;
                    var espacoAbaixo = window.innerHeight - anchor.bottom - MARGEM;
                    var altura = box.offsetHeight;
                    var abrirAbaixo = altura > espacoAcima && espacoAbaixo > espacoAcima;
                    if (abrirAbaixo) box.classList.add('below');
                    var disponivel = abrirAbaixo ? espacoAbaixo : espacoAcima;
                    if (altura > disponivel) box.style.maxHeight = Math.max(160, disponivel) + 'px';
                });
            });
            document.addEventListener('click', function () {
                document.querySelectorAll('.tooltip').forEach(function (t) { t.classList.remove('tooltip-active'); });
            });
        }

        /* ---------------- Boot ---------------- */
        document.addEventListener('DOMContentLoaded', function () {
            var lang = PAGE_LANG;

            initializeBasicContent(lang);
            fillRemainingSectionTitles(lang);
            renderSkillColumn('skills-strategic', 'strategic', lang);
            renderSkillColumn('skills-tools', 'tools', lang);
            renderSkillColumn('skills-emerging', 'emerging', lang);
            renderExperience(lang);
            renderEducationCards(lang);
            renderProjectCards(lang);
            initializeModalTexts(lang);
            buildTicker(lang);

            splitName();
            wrapMetrics(document.getElementById('cv-experience'));

            initFabric();
            initCursor();
            initTilt();
            initMagnetic();
            initScrollProgress();
            initTooltips();
            initReveal();
        });
    </script>
    <script src="../../assets/js/dynamic-favicon.js"></script>
</body>
